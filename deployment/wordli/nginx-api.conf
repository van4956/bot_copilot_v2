# Применять вместо заглушки только после отдельного разрешения на выкладку.
server {
    listen 80;
    listen [::]:80;
    server_name copilot-games-v4956.duckdns.org;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/copilot-games-v4956/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 301 https://copilot-games-v4956.duckdns.org$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name copilot-games-v4956.duckdns.org;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/copilot-games-v4956.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/copilot-games-v4956.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WORDLI_SSL:5m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    client_max_body_size 32k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location = /healthz {
        default_type text/plain;
        return 200 "wordli-https-ready\n";
    }
    location / {
        proxy_pass http://127.0.0.1:8770;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 15s;
        proxy_buffering off;
    }
}
