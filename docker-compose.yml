services:
  bot:
    build: .
    container_name: container_bot
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - APP_ENV=production
      - WORDLI_ENABLED=${WORDLI_ENABLED:-false}
      - WORDLI_WEBAPP_URL=${WORDLI_WEBAPP_URL:-}
      - AUTO_CREATE_SCHEMA=false
      - DROP_PENDING_UPDATES=false
      - BOT_TOKEN=${BOT_TOKEN}
      - BOT_TOKEN_TEST=${BOT_TOKEN_TEST}
      - OWNER=${OWNER}
      - ADMIN_LIST=${ADMIN_LIST}
      - HOME_GROUP=${HOME_GROUP}
      - WORK_GROUP=${WORK_GROUP}
      - PAYMASTER_PROVIDER_TOKEN=${PAYMASTER_PROVIDER_TOKEN}
      - API_GPT=${API_GPT}
      - API_WEATHER=${API_WEATHER}
      - API_CURRENCY=${API_CURRENCY}
      - DB_POST=${DB_POST}
      - DB_LITE=${DB_LITE}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
    networks:
      - botnet
      - backend
    restart: unless-stopped # Автоматический перезапуск контейнера, если он остановится

  db:
    image: postgres:15-bookworm@sha256:539ceaaae49b3a7c8a04467cf00cc6788d8e3f1675df41860d86eebc4c40524f
    container_name: container_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine@sha256:26f9c92117b446e9baee4e4a6e455a4a59a2b50138eef3da4dd32919d4252d0d
    container_name: container_redis
    volumes:
      - redis_data:/data # Сохраняем данные Redis как Docker volume
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  botnet:
    name: bot_copilot_net
    driver: bridge
  backend:
    name: bot_copilot_backend
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local # Используем локальный драйвер для хранения данных Redis
